<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Button Page</title>
</head>
<body>
    <button id="sampleButton">Click Me!</button>

    <script>
        const button = document.getElementById('sampleButton');

        button.addEventListener('click', () => {
            document.body.insertAdjacentHTML(
                'beforeend',
                '<p id="result">Button clicked!</p>'
            );
        });
    </script>
</body>
</html>
